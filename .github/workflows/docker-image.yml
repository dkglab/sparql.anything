name: Publish Docker image

on:
  release:
    types: [published]

jobs:
  push_to_registry:
    name: Release docker image and jar files
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      
      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ vars.DOCKER_REPO }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .  
          file: ./Dockerfile
          push: true
          build-args: GITHUB_REF=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: shrink/actions-docker-extract@v4
        id: extract
        with:
          image: ${{ vars.DOCKER_REPO }}
          path: /app/artifacts/.

      - name: Extract files to release from docker image
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.extract.outputs.destination }}
          name: artifacts

      - name: Release files
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.extract.outputs.destination }}/*